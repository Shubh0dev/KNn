kind = "web"
previewPath = "/"
title = "KashiNagri"
description = "A premium destination discovery and trip-planning website for Varanasi, bringing together places to stay, food, spiritual services, local areas, travel guides, and itinerary inspiration."
version = "1.0.0"
id = "artifacts/kashi-nagri"
router = "path"

[[services]]
name = "web"
paths = [ "/", "/_next/hmr" ]
localPort = 24625

[services.development]
run = "pnpm --filter @workspace/kashi-nagri run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kashi-nagri", "run", "build" ]
serve = "static"
publicDir = "artifacts/kashi-nagri/dist/public"


[services.env]
PORT = "24625"
BASE_PATH = "/"
