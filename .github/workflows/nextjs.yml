# The site now runs as a Next.js server (Supabase Auth needs cookies, the
# proxy and Server Actions), so it can no longer be deployed to GitHub Pages.
# Deploy by connecting the repository to Vercel (or another Node host).
# This workflow only verifies that the app type-checks and builds.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
